<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Zoo Manager</title>

    <style>

        body{
         font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
         background-color: #0af969;
         color: #222222;
        }

        h1{
         text-align: center;
         color: darkgreen; 
        }

        #zoo{
         width: 800px;
         margin: 20px auto;
         padding: 15px;
         border: 2px solid darkgreen;
         background-color: #069c1f;
        }

        .zone{
         width: 430px;
         margin: 20px auto;
         padding: 15px;
         border: 2px solid seagreen;
         background-color: #069c1f;
         text-align: left;
        }

        .animal{
         font-weight: bold;
         color: darkblue;
        }

        button{
         margin: 10px;
         padding: 10px 22px;
         border: 2px solid darkgreen;
         border: none;
         border-radius: 20px;
         background-color: #27a304;
         color: beige;
         cursor: pointer;
         font-weight: bold;
        }

        #output{
         width: 520px;
         margin: 20px auto;
         padding: 15px;
         border: 2px dashed darkgreen;
         background-color: #ffffff;
         text-align: left;
        }

    </style>

</head>


<body>

    <h1>
        My Digital Zoo Manager
    </h1>

    <p>
        Use JavaScript and the DOM to explore animals, zones, parent nodes, child nodes, and sibling nodes.
    </p>

    <div id="zoo">

        <div class="zone" id="lionzone">
            <h2>
                Lion Zone
            </h2>
            <p>
                Animal : <span class="animal">Panda</span>
            </p>
        </div>

         <div class="zone" id="elephantzone">
            <h2>
                Elephant Zone
            </h2>
            <p>
                Animal : <span class="animal">Elephant</span>
            </p>
        </div>

         <div class="zone" id="tigerzone">
            <h2>
                Tiger Zone
            </h2>
            <p>
                Animal : <span class="animal">Tiger</span>
            </p>
        </div>




    </div>

    <button onclick="managezoo()">Manage Zoo</button>

    <div id="output">
        Zoo information will appear here.
    </div>

    <script>

        function managezoo(){
            // HTML DOM: 

            let zoo = document.getElementById("zoo");
            let lionzone = document.getElementById("lionzone");
            let elephantzone = document.getElementById("elephantzone");
            let tigerzone = document.getElementById("tigerzone");
            let output = document.getElementById("output");


             // The DOM tree: zoo is the parent container of all animal zones 

             let parentNodeName = lionzone.parentNode.id;

             //parent, child, and sibling nodes

             let firstchildzone = zoo.children[0].id;
             let secondchildzone = zoo.children[1].id;
             
             let nextsiblingzone = lionzone.nextElementSibling.id;
             let previoussiblingzone = tigerzone.previousElementSibling.id;

             //types of Nodes

             let elementNodeType = lionzone.nodeType;
             let textNodeType = lionzone.firstChild.nodeType;

             // Java Script and the DOM : 
             //changing content and style of elements

             lionzone.style.backgroundColor = "#fffc3d";
             elephantzone.style.backgroundColor = "#d1ecf1";
             tigerzone.style.backgroundColor = "#f8d7da";

             lionzone.querySelector("h2").innerHTML = "Updated Lion Zone";
             elephantzone.querySelector("h2").innerHTML = "Updated Elephant Zone";
             tigerzone.querySelector("h2").innerHTML = "Updated Tiger Zone";

                //output to the page

                output.innerHTML = "<strong>DOM Tree Information : </strong><br>" + "Parent of lion zone: " + 
                parentnodename + "<br>" + "First child zone of zoo: " + firstchildzone + "<br>" + "Second child zone of zoo: " + secondchildzone + "<br><br>" +

                "<strong>Types of Nodes : </strong><br>" + 
                "Lion Zone element node type : " + elementnodetype + "<br>" + "Lion Zone first child text node type : " + textnodetype + "<br><br>" +

                "<strong>DOM UPdate : </strong><br>" + 
                "The animal zone headings and background colours were updated using javascript."
                ;

        }


    </script>
    
</body>
</html>
