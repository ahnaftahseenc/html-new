<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Phone Contact</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #fe78bb55;
      }

      h1 {
        color: #ffb6d9;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 1px;
        text-align: center;
        text-shadow: 0 0 20px #ff80bf55;
      }

      h2 {
        color: #e7b8ff;
        font-size: 23px;
        font-weight: 600;
      }

      .card {
        max-width: 650px;
        margin: 30px auto;
        padding: 30px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 182, 217, 0.25);
        border-radius: 24px;
        box-shadow: 0 15px 45px #00000040;
        backdrop-filter: blur(12px);
      }

      .card-label {
        font-size: 11px;
        color: #e30772;
        text-transform: uppercase;
        letter-spacing: 3px;
        font-weight: 600;
      }

      p,
      pre {
        font-size: 14px;
        color: #cb0987;
        line-height: 1.9;
      }
    </style>
  </head>
  <body class="py-4">
    <div class="container">
      <h1 class="mb-1">My Phone Contact</h1>
      <p class="text-muted mb-4">
        Introduction to Objects in JavaScript - Grade 4-6
      </p>

      <!-- contact card -->

      <div class="card shadow-sm mb-3" style="max-width: 400px">
        <div class="card-body">
          <h5 class="card-title" style="color: #830349">Contact Details</h5>
          <ul class="list-group list-group-flush">
            <li class="list-group-item">
              <span class="card-label d-block"> Name : </span>
              <strong id="name">-</strong>
            </li>

            <li class="list-group-item">
              <span class="card-label d-block"> Phone : </span>
              <strong id="phone">-</strong>
            </li>

            <li class="list-group-item">
              <span class="card-label d-block"> School : </span>
              <strong id="school">-</strong>
            </li>

            <li class="list-group-item">
              <span class="card-label d-block"> City : </span>
              <strong id="city">-</strong>
            </li>
          </ul>
        </div>
      </div>

      <!-- Code Box -->
      <div class="card shadow-sm" style="max-width: 400px">
        <div class="card-body">
          <h6 style="color: #92054b55">JavaScript Object Used</h6>
          <pre id="codeDisplay" class="bg-light p-3 rounded border mb-0"></pre>
        </div>
      </div>
    </div>
    <!-- container -->

    <script>
        var mycontact = {
          name: "Inan Chowdhury",
          phone: "880144558**",
          school: "SCPSC",
          city: "Sylhet"
      };

      var nameE1 = document.getElementById("name");
      var phoneE1 = document.getElementById("phone");

      nameE1.textContent = mycontact.name;
      phoneE1.textContent = mycontact.phone;


      var schoolEl = document.getElementById("school");

      var cityEl = document.getElementById("city");

      schoolEl.textContent = mycontact["school"];
      cityEl.textContent = mycontact["city"];


      var codeE1 = document.getElementById("codeDisplay");
      codeE1.textContent = 
      "var mycontact = {\n" + 
      ' name: "' + mycontact.name + '",\n' +
      ' phone: "'+ mycontact.phone + '",\n' +
      ' school: "'+ mycontact['school'] + '", \n' +
      ' city: "' + mycontact['city'] + '", \n'+
      '};';





      
    </script>
  </body>
</html>
