<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
  </head>
  <body>
      <h1 class="title">Hello World!</h1>
      <p id="currentTime">This is a paragraph</p>

      <!-- lists: ordered list and unordered list -->
      <!-- ordered list -->
      <!-- and ordered list container serial number -->
      <!-- ol => ordered list and li => list item -->
      <ol>
        <li>Apple</li>
        <li>Ornage</li>
        <li>Banana</li>
        <li>Cherry</li>
        <li>Litchi</li>
      </ol>

      <!-- ordered list of links -->
      <ol>
        <li>
          <a href="https://facebook.com">Facebook</a>
        </li>
        <li>
          <a href="https://instagram.com">Instagram</a>
        </li>
        <li>
          <a href="https://linkedin.com">LinkedIn</a>
        </li>
      </ol>

      <!-- unordered list: bullet list -->
      <ul>
        <li>Shoes</li>
        <li>Watch</li>
        <li>T-shirt</li>
        <li>Belt</li>
        <li>Jeans</li>
      </ul>

      <ul>
        <li>
          <a href="https://amazon.in">Amazon</a>
        </li>
        <li>
          <a href="https://flipkart.in">Flipkart</a>
        </li>
        <li>
          <a href="https://ebay.com">Ebay</a>
        </li>
      </ul>


      <!-- html tables -->
      <!-- table tag = creating overall table -->
      <!-- thead tag = table head used for creating table headings -->
      <!-- tbody tag = table body used for creating the body of the table -->
      <!-- tr => table row used to creating rows (horizotally) -->
      <!-- th => table heading used for creating column heading in the thead -->
      <!-- td => table data used for creating columns in the tbody -->

      <!-- column creation (thead -> th) (tbody -> td) -->
      <table border="1">
        <thead>
          <tr>
            <th>Roll</th>
            <th>Name</th>
            <th>GPA</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>101</td>
            <td>Rohim</td>
            <td>5.00</td>
          </tr>
          <tr>
            <td>102</td>
            <td>Korim</td>
            <td>4.50</td>
          </tr>
        </tbody>
      </table>

      <!-- images -->
      <!-- src = source -->
      <!--img is a self closing tag-->
      <img src="https://img.magnific.com/premium-photo/spiderman-heroic-pose-with-webs-action_1199394-71910.jpg" alt="Spiderman" width="300">

      <!-- audio -->
      <audio controls>
        <source src="https://www.computerhope.com/jargon/m/example.mp3" type="audio/mp3" />
      </audio>

      <!-- video -->
      <video controls width="500">
        <source src="http://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4" />
      </video>
    
    <!-- iframe -->
    <!-- <iframe src="https://indianvirginhumanhair.com" frameborder="0" width=100% height="500"></iframe> -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/JuBBIJ7adjM?si=R_SUFM7vGojbtfIJ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d29991.408378014203!2d57.56111086334856!3d-20.01161828458433!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x217dab7739bd6edb%3A0xb470aaccbadadf71!2sGrand%20Baie%2C%20Mauritius!5e0!3m2!1sen!2sin!4v1786813106122!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

  </body>
</html>
