<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSuperhero Card </title>

    <style>
        body{

            background-color: rgb(0, 7, 27);
            color: wheat;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        
        }

        .hero-name {
         font-size: 65px;
         font-weight: bold;
         color: rgb(249, 249, 93);
         text-shadow: 4px 4px rgba(196, 127, 0, 0.985);
        }

        .tagline{
         font-style: italic;
         color: rgb(38, 194, 186);
         text-transform:capitalize;
        }

        .label{
         text-transform: uppercase;
         text-decoration: underline;
         color: rgb(217, 111, 35);
        }


        .power{
         font-weight: bold;
         color: rgb(59, 255, 59);
        }

        .weakness{
         text-decoration:line-through;
         color: gray;
        }

        .badge{
         font-size: 31px;
         font-weight: bold;
         color: goldenrod;
         transform: rotate(11deg); 
        }

        .made-by{
         color: coral;
         font-style: italic;
        }



    </style>
</head>
<body>

    <h1 class="hero-name">Thunder Kid</h1>
    <p class="tagline">the most powerful hero in the school.</p>

    <h2 class="label">Super powers</h2>
    <p class="power">can run faster than a cheetah.</p>
    <p class="power">Can lift a school bus.</p>


    <h2 class="label">weaknesses</h2>
    <p class="weakness">Maths homework.</p>
    <p class="weakness">Broccoli.</p>

    <p class="badge">Top Hero!</p>

    <p class="made-by">Created by  ___Ahnaf___</p>

        
</body>
</html>
