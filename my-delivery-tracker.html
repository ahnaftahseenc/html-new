<!DOCTYPE html>
<html>
    <head>
        <title>
            My Delivery Tracker : 
        </title>


        <style>

        body {
          min-height: 100vh;
          margin: 0;
          display: grid;
          place-content: center;
          background: 
          radial-gradient(circle at top, #1b1b2f, #0b0b14);
         font-family: "Segoe UI", system-ui, sans-serif;
          color: #e8e6f0;
        }

        h1{
         margin: 0 0 20px;
         font-size: 1.6rem;
         font-weight: 300;
         letter-spacing: 3px;
         text-transform: uppercase;
         background: linear-gradient(90deg, #f5d98b, #c9a24b);
         -webkit-background-clip: text;
         color: transparent;
        }

        div {
            display: flex;
            justify-content: space-between;
            gap: 40px;
            padding: 10px 0;
            border-bottom: 1px solid #ffffff14;
            font-size: 0.8rem;
            color: #9a98ad;
        }

        button {
            margin: 0 8px 22px 0;
            padding: 10px 22px;
            border: 1px solid #c9a24b;
            border-radius: 999px;
            background: transparent;
            color: #f5d98b;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.25s;
        }

        button:active{
         background: #c9a24b;
         color: #0b0b14;
         box-shadow: 0 0 18px #c9a24b66;
         transform: scale(0.96);
        }
            

        span {
          color: #fff;
         font-family: ui-monospace, monospace;
         font-size: 0.9rem;
        }

        .thanks {
         display: none;
         position: center;
         text-align: center;
         flex-direction: column;
         align-items: center;
         margin-top: 22px;
         padding: 16px;
         border: 1px solid #c9a24b55;
         border-radius: 14px;
         background: #c9a24b14;
         color: #f5d98b;
         font-size: 0.95rem;
         letter-spacing: 1px;
         text-align: center;
        }

    

        #status { 
                color: #f5d98b; 
            }

        #result { 
                color: #6ee7b7; 
            }
        </style>
    </head>


    <body>

        <h1>
            My Delivery tracker
        </h1>
        <button onclick="saveOrder()">
            Save Order
        </button>
        <button onclick="startDelivery()">
            Start Delivery
        </button>


        <div>
            JSON Text : <span id="json-text"></span>
        </div>
        
        <div>
            Loaded Item : <span id="loaded-item"></span>
        </div>
        
        <div>
           Loaded Price : <span id="loaded-price"></span>
        </div>

        <div>Status : <span id="status"></span></div>
        <div>Result : <span id="result"></span></div>

        <div id="thanks" class="thanks">
          Thank you for ordering with us!
       </div>





        <script>

            // JSON - the order stored as a JavaScript object 

            let order = {
                item : "Pizza",
                price : 887,
                shop : "Pizza Lane",
            };


            // JSON.stringify() and JSON.parse()

            function saveOrder() {
                let jsonText = JSON.stringify(order);
                let loadedOrder = JSON.parse(jsonText);

                document.getElementById("json-text").innerHTML = jsonText;
                document.getElementById("loaded-item").innerHTML = loadedOrder.item;
                document.getElementById("loaded-price").innerHTML = "BDT " + loadedOrder.price;
            }

            // delay() - waits ms milliseconds - do not change this 

            function delay(ms) {
                return new Promise(function(resolve) {
                    setTimeout(resolve, ms);
                });
            }

            // async and await - track the delivery step by step 
            async function startDelivery() {
                document.getElementById("result").innerHTML = "";

            // setTimeout with a callback function - runs after 1 second
            document.getElementById("status").innerHTML = "Order received! ";

            setTimeout(function() {

                 document.getElementById("status").innerHTML = "Kitchen is preparing...";
            }, 1000);

            // await - pause for 3 seconds
            await delay(3000);
            document.getElementById("status").innerHTML = "Out for delivery!";

            

            // await pause for 2 seconds
            await delay(2000);
            document.getElementById("result").innerHTML = "Your order has arrived! ";

              // thanks message

            await delay(1000);
            document.getElementById("thanks").style.display = "flex";

          

        }




        
        </script>
    </body>
</html>
