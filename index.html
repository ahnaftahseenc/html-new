<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Study Progress Dashboard</title>
    
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

     <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>

      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


    <style>
        body{
         background-color: #f4f7ff;
         font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        .jumbotron{
         background-color: #e8edff;
         border-left: 6px solid #ff5a43;
        }

        .jumbotron h1{
         color: #ff5a43;
         margin-top: 30px;
         margin-bottom: 15px;
        }

        .section-title{
         color: #ff5a43;
         margin-top: 30px;
         margin-bottom: 15px;
        }

        p{
         font-weight: bold;
         margin-bottom: 5px;
        }
    </style>


</head>
<body>
    <div class="kumbotron jumbotron-fluid">
        <div class="container">
            <h1>My Study Progress Dashboard</h1>
            <p class="lead">
                Track your subjects, completed lessons, and learning progress in one place.
            </p>

            <button class="btn btn-primary">
                Math
            </button>
            
            <button class="btn btn-success">
                Science
            </button>
            
            <button class="btn btn-danger">
                 English
            </button>
            
            <button class="btn btn-warning">
                Coding
            </button>

        </div>
    </div>

    <div class="container">
        <h2 class="section-title">
            Lessons Completed : <span class="badge badge-danger">24</span>
        </h2>

        <p>Math <span class="badge badge-primary">8 lessons</span></p>

        <p>Science <span class="badge badge-success">6 lessons</span></p>

        <p>English <span class="badge badge-warning">5 lessons</span></p>

        <p>Coding <span class="badge badge-info">5 lessons 
        </span></p>

        <h2 class="section-title">Subject Progress : </h2>

        <p>Math</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated" style="width: 81%">
                81%           
            </div>
        </div>

         <p>Science</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success progress-bar-striped progress-bar-animated " style="width: 65%">
                65%           
            </div>
        </div>

        <p>English</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning progress-bar-striped progress-bar-animated " style="width: 55%">
                55%           
            </div>
        </div>

        <p>Coding</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-danger progress-bar-striped progress-bar-animated " style="width: 70%">
                70%           
            </div>
        </div>

    </div>

    
</body>
</html>
