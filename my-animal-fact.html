<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animal Fact File</title>

    <style>
        body{
         background:linear-gradient(135deg, #071c14, #123c2a);
         font-family: Arial, sans-serif;
         margin: 0;
         padding: 40px; 
        }

        .fact-file{
         background-color: #fff8df;
         color: #26382f;
         width: 300px;
         padding: 28px;
         border: 3px solid #d4a843;
         border-radius: 15px;
         margin: 30px auto;
         box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }


        .cool-fact {
        color: #b66a00;
        font-style: italic;
        font-weight: bold;
        background-color: #fff0c2;
       padding: 12px;
       border-left: 4px solid #d4a843;
       border-radius: 5px; }


        .animal-name {
         color: #155c3b;
         font-size: 28px;
         margin-top: 0;
         border-bottom: 2px solid #d4a843;
         padding-bottom: 10px;
        }

        .detail{
         color: #b66a00;
         font-style: italic;
         font-weight: bold;
         background-color: #fff0c2;
         padding: 12px;
         border-left: 4px solid #d4a843;
         border-radius: 5px;
        }

        header{
         text-align: center;
         color: #f4c95d;
         padding: 25px;
        }
        
        
        header h1{
         font-size: 38px;
         margin-bottom: 8px;
        }

        header p {
         color: #d8dfd5;
         font-size: 17px;
        }

        </style>

</head>
<body>

    <header>
        <h1>My Animal Fact File</h1>
        <p>Discover fascinating facts about my favorite animals!</p>
    </header>

    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="detail">Type: Big Cat</p>
        <p class="detail">Lives in: Mountain ranges of Central Asia.</p>
        <p class="detail">Diet: Deer, goats, and wild sheep.</p>
        <p class="cool-fact">
            Cool Fact: Can leap up to 15 meters in one jump!
        </p>
    </div>
    
</body>
</html>
