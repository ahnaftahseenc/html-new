<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favourite Person Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        
    body {
        background: linear-gradient(135deg, #0f1028, #251642, #401f48);
        color: #f8f0ff;
        font-family: 'Poppins', sans-serif;
        margin: 0;
        padding: 30px;
    }

    h1 {
        color: #ffb6d9;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 1px;
        text-align: center;
        text-shadow: 0 0 20px #ff80bf55;
    }

    h2 {
        color: #e7b8ff;
        font-size: 23px;
        font-weight: 600;
    }

    .card {
        max-width: 650px;
        margin: 30px auto;
        padding: 30px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 182, 217, 0.25);
        border-radius: 24px;
        box-shadow: 0 15px 45px #00000040;
        backdrop-filter: blur(12px);
    }

    .card-label {
        font-size: 11px;
        color: #ffb6d9;
        text-transform: uppercase;
        letter-spacing: 3px;
        font-weight: 600;
    }

    p, pre {
        font-size: 14px;
        color: #e6dced;
        line-height: 1.9;
    }

    img {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 50%;
        border: 3px solid #ffb6d9;
        box-shadow: 0 0 25px #ff80bf55;
        display: block;
        margin: 20px auto;
    }

    a {
        color: #ffb6d9;
        text-decoration: none;
        transition: 0.3s;
    }

    a:hover {
        color: #ffffff;
        text-shadow: 0 0 10px #ffb6d9;
    }

    hr {
        border: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, #ffb6d9, transparent);
        margin: 25px 0;
    }

    button {
        background: linear-gradient(135deg, #ff8fc7, #c084fc);
        color: #20102e;
        border: none;
        padding: 12px 24px;
        border-radius: 30px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px #ff8fc755;
    }

    .quote {
        color: #ffc7e3;
        font-style: italic;
        text-align: center;
        font-size: 16px;
    }
</style>

</head>
<body class="py-4">

    <div class="container">
        <h1 class="mb-1">
            My Favourite Person Profile
        </h1>

        <p class="text-muted-mb-4">
            Introduction to Objects in JavaScript
        </p>

        <!-- profile card -->

        <div class="card shadow-sm mb-3" style="max-width: 400px">
            <div class="card-body">
                <h5 class="card-title" >
                    Profile Details
                </h5>
                <ul class="list-group-item">
                    <li class="list-group-item">
                        <span class="card-label d-block">Name : </span><strong id="name">-</strong>
                    </li>
                     <li class="list-group-item">
                        <span class="card-label d-block">Relationship : </span><strong id="relationship">-</strong>
                    </li> 
                    <li class="list-group-item">
                        <span class="card-label d-block">Favourite  Activity : </span><strong id="activity">-</strong>
                    </li> 
                    <li class="list-group-item">
                        <span class="card-label d-block">City : </span><strong id="city">-</strong>
                    </li>

                </ul>
            </div>
        </div>


        <!--code box-->
        <div class="card shadow-sm" style="max-width: 400px;">
            <div class="card-body">
                <h6 style="color: #ff5a43;">
                    JavaScript Object Used
                </h6>
                <pre id="codeDisplay" class="bg-light p-3 rounded border mb-0"></pre>
            </div>
        </div>
    </div>

    <script>

        const favp = {
            name: 'Inan' ,
            relationship: "My fav person",
            activity : "play e-football",
            city: "sylhet",
        };

        //step-2 Use of DOT notation
        document.getElementById("name").innerHTML = favp.name;

        document.getElementById("relationship").innerHTML = favp.relationship;

        //step-3 Use BRACKET notation
        document.getElementById('activity').innerHTML = favp['activity'];

        document.getElementById("city").innerHTML = favp['city'];

        //step-4 show the object inside the code box
        document.getElementById("codeBox").textContent = JSON.stringify(favp, null, 4);

    </script>

    
</body>
</html>
