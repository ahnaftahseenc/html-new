<!DOCTYPE html>
<html>
    <head>

        <title>
            School Event Data Viewer
        </title>


   <style>


    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: #e2e8f0;
      text-align: center;
      padding: 15px;
    }

    .event-card {
      max-width: 520px;
      margin: 30px auto;
      padding: 25px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
      box-shadow: 0 10px 30px #0005;
    }

    h1 { color: #67e8f9; 
    }


    button {
      background: #06b6d4;
      color: #082f49;
      border: none;
      border-radius: 25px;
      padding: 12px 22px;
      font-weight: bold;
      cursor: pointer;
    }


    button:hover { background: #a5f3fc; 
    }

    .info-box {
      background: #273449;
      border: 1px solid #475569;
      border-radius: 12px;
      margin-top: 18px;
      padding: 12px 16px;
      text-align: left;
      line-height: 1.6;
    }


    h2 { color: #c4b5fd; font-size: 18px; 
    }

    #status { color: #86efac; font-weight: bold;
    }


    #jsonOutput {
      color: #fcd34d;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

  </style>

</head>

    <body>

    <div class="event-card">
      <h1>
        ✦ School Event Viewer
      </h1>
      <p>
        Explore your school event data with JSON and async JavaScript.
      </p>


    <button onclick="showSchoolEvent()">
        Load Event Details ↗
    </button>

    <div class="info-box">
      <h2>
        Loading Status 
      </h2>
      <p id="status">
        ● Waiting to load event data...
      </p>
    </div>

    <div class="info-box">
      <h2>
        Event Details
     </h2>
      <p id="eventDetails">
        No event loaded yet.
      </p>
    </div>

    <div class="info-box">
      <h2>
        JSON Text Output 
      </h2>
      <p id="jsonOutput">
        JSON data will appear here.
     </p>
    </div>
  </div>






        <script>
            //call back function

            function showLoadingMessage(message) {
                document.getElementById("status").innerHTML = message;
            }

            // promise in js

            function fetchschooleventdata(callback) {
                callback("Loading school event data... Please wait. ");

                return new Promise(function(resolve) {

                    // Asynchronus JS using setTimeout() 

                    setTimeout(function() {

                        // JSON data

                        let schoolevent = {
                            eventName : "Annual Science Fair",
                            date : " 15 December 2026 ",
                            time : "10.00 AM",
                            venue : "Auditorium",
                            coordinator : "Ms. Priya",
                            participants : 350,
                            isRegistrationOpen : true,
                        };

                        resolve(schoolevent);

                    }, 3000);

                });
            }

            // async/ await in javascript
            async function showSchoolEvent() {
                
                let eventData = await 
                fetchschooleventdata(showLoadingMessage);

                document.getElementById("status").innerHTML = 
                " Event data loaded successfully! ";

                // JSON.stringify()

                let jsonText = JSON.stringify(eventData);

                // JSON.parse()

                let parsedEvent = JSON.parse(jsonText);


                // String concatenation to build the final display message

                let eventMessage = "";
                eventMessage = eventMessage + "Event Name : " + 
                parsedEvent.eventName + "<br>" ;

                eventMessage = eventMessage + "Date : " + 
                parsedEvent.date + "<br>" ;

                eventMessage = eventMessage + "Time : " + 
                parsedEvent.time + "<br>" ;

                eventMessage = eventMessage + "Venue : " + 
                parsedEvent.venue + "<br>" ;

                eventMessage = eventMessage + "Coordinator : " + 
                parsedEvent.coordinator + "<br>" ;

                eventMessage = eventMessage + " Participants : " + 
                parsedEvent.participants + "<br>" ;


                if (parsedEvent.isRegistrationOpen === true) {
                    eventMessage = eventMessage + "Registration Status : Open";
                } else {
                    eventMessage = eventMessage + "Registration Status : Closed";
                }

                document.getElementById("eventDetails").innerHTML = eventMessage;

                document.getElementById("jsonOutput").innerHTML = jsonText;

            }


        </script>

    </body>
</html>
