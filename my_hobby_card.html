<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- STEP 1 - Bootstrap CSS link -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">


    <style>
        body{
         background-color: #f9f9f9;
         font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
         padding: 30px 15px;
        }

        h1{
         text-align: center;
         color: #FF5A43;
        }

        .hobby-card{
         text-align: center;
         border: 2px solid #FF5A43;
         border-radius: 8px;
         padding: 20px;
         margin-bottom: 20px;
         background-color: #fff8e1;
        }

        .hobby-card h3 {
         color: #ff5a43;
        }
    </style>

    <title>My Hobby Cards</title>


</head>
<body>

    <h1>My Hobby Cards</h1>

    <!-- Step 2 - container keeps the layout neat and centered -->
    <div class="container">


      <!-- STEP 3 - row holds all the columns in one horizontal line -->
      <div class="row">


        <!-- STEP 4 - col-12: full width on phones
                      col-md-6: half width on tablets
                      col-lg-4: one-third on desktops -->

        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>Painting</h3>
                <p>I love sketching animals and comic characters.</p>
            </div>
        </div>

        <div class="col-12 col-md-12 col-lg-4">
            <div class="hobby-card">
                <h3>Reading</h3>
                <p>My favourite books are adventure stories and deteactive series.</p>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>Cricket</h3>
                <p>I play cricket every evening with my friends.</p>
            </div>
        </div>


     </div>    

    </div>

    <!-- STEP5 - bootstrap js script -->
    <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    
</body>
</html>
