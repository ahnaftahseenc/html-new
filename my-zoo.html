<!DOCTYPE html>
<head>

    <title>
        My Zoo
    </title>

<style>

    body{
     font-family: 'Times New Roman', Times, serif;
     background-color: rgb(177, 217, 252);
     text-align: center;
     padding: 30px;
    }

    h1{
     color: #2c03c0;
    }

    #zoo{
     border: 2px solid #ff5a43;
     width: 300px;
     margin: 16px auto;
     padding: 12px;
     border-radius: 10px;
     background: greenyellow;
    }

    .zone {
     border: 1px solid sandybrown;
     margin: 6px 0;
     padding: 8 px 12px;
     border-radius: 8px;
     text-align: left;
    }

    button{
     background-color: #ff5a43;
     color: aqua;
     padding: 10px 24px;
     border: none;
     border-radius: 20px;
     cursor: pointer;
    }


</style>
</head>

<body>


    <h1>
        My Zoo 
    </h1>

    <p>
        Use JS and the DOM to add animals to each cage!
    </p>

    <!--DOM tree : zoo is the parent element node.

    -->



    <div id="zoo">
        <div class="zone">
            Zone 1 : <span id="zone1"></span>
        </div>
        <div class="zone">
            Zone 2 : <span id="zone2"></span>
        </div>
        <div class="zone">
            Zone 3 : <span id="zone3"></span>
        </div>
        <div class="zone">
            Total Animals : <span id="total"></span>
        </div>
    </div>

    <br>

    <button onclick="openzoo()">
        Open the Zoo!
    </button>

    <p id="zoo-status"></p>


    <script>

        function openzoo() {
            document.getElementById("zone1").innerHTML = "Lion";
            document.getElementById("zone2").innerHTML = "Elephant";
            document.getElementById("zone3").innerHTML = "Penguin";

            document.getElementById("total").innerHTML = 3;

            document.getElementById("zoo").style.backgroundColor = "lightgreen";

            document.getElementById("zoo-status").innerHTML = document.title + " is now open!";

        }

    </script>
</body>
